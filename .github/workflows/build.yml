name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke CLI
        shell: pwsh
        run: |
          if (Test-Path ./build/Release/astro-voyager.exe) {
            ./build/Release/astro-voyager.exe --demo-geodesic
          } else {
            ./build/astro-voyager --demo-geodesic
          }
      - name: Static checks
        shell: pwsh
        run: ./tests/test_static_checks.ps1
      - name: Validate shaders (glslang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends glslang-tools
          for f in shaders/*.vert shaders/*.frag; do
            echo "== $f"
            glslangValidator "$f"
          done

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t astro-voyager:ci .
