name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # macOS: core CLI + tests + static checks (Apple clang).
        # The full macOS OpenGL app is built by the build-macos-gl job below.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke CLI
        shell: pwsh
        run: |
          if (Test-Path ./build/Release/astro-voyager.exe) {
            ./build/Release/astro-voyager.exe --demo-geodesic
          } else {
            ./build/astro-voyager --demo-geodesic
          }
      - name: Static checks
        shell: pwsh
        run: ./tests/test_static_checks.ps1
      - name: Validate shaders (glslang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends glslang-tools
          for f in shaders/*.vert shaders/*.frag; do
            echo "== $f"
            glslangValidator "$f"
          done

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Build image (no push)
        run: docker build -t astro-voyager:ci .

  # === macOS GL distribution build (v3.4.0) ===: system OpenGL 3.3 core
  # (no GLEW, src/GLCompat.h), GLFW/GLM/ImGui/stb fetched like the AppImage
  # job. Runner is Apple Silicon (arm64) and headless: the smoke test uses
  # the CLI paths of the GL binary; windowing is a manual check. The binary
  # must link OpenGL.framework and contain no GLEW.
  build-macos-gl:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Fetch GL sources (GLFW/GLM/ImGui/stb)
        run: bash packaging/fetch-gl-deps.sh
      - name: Configure and build (GL)
        run: |
          cmake -S . -B build-gl -DCMAKE_BUILD_TYPE=Release -DASTROVOYAGER_ENABLE_GL=ON
          cmake --build build-gl -j3
      - name: Smoke CLI of the GL binary
        run: |
          ./build-gl/astro-voyager --version
          ./build-gl/astro-voyager --demo-geodesic
          ./build-gl/astro-voyager --list | head -5
      - name: Verify GL linkage (OpenGL.framework, no GLEW)
        run: |
          otool -L build-gl/astro-voyager | tee /tmp/otool.txt
          grep -q "OpenGL.framework" /tmp/otool.txt
          ! grep -qi "glew" /tmp/otool.txt
      - name: Static checks
        shell: pwsh
        run: ./tests/test_static_checks.ps1
      - name: Package (binary + shaders + res)
        run: |
          set -euo pipefail
          stage="dist/astro-voyager-macos-arm64"
          mkdir -p "$stage"
          cp build-gl/astro-voyager "$stage/"
          cp -R shaders res "$stage/"
          tar -czf dist/astro-voyager-macos-arm64.tar.gz -C dist astro-voyager-macos-arm64
          shasum -a 256 dist/astro-voyager-macos-arm64.tar.gz
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: astro-voyager-macos-arm64
          path: dist/astro-voyager-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Attach macOS archive to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/astro-voyager-macos-arm64.tar.gz --clobber
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'

  # === Windows portable (v3.6.0) ===: полноценная GL-сборка на MSVC. Шейдеры
  # вшиты в exe (packaging/embed_shaders.cmake), каталог и созвездия — код,
  # шрифты системные: ассет релиза astro-voyager.exe запускается «с коробки»
  # одним файлом (плюс zip с README/LICENSE). GLEW статический (glew32s.lib),
  # GLFW/GLM/ImGui/stb тянутся из upstream (Dependencies/ и src/vendor/ в
  # gitignore). Headless-рендер на раннере недоступен (нет GL 3.3 драйвера) —
  # проверяются CLI, таблица встроенных шейдеров и запуск из чистой папки.
  build-windows-gl:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Fetch GL sources (GLFW/GLM/ImGui/stb + GLEW, like local build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip" -OutFile glfw.zip
          Expand-Archive glfw.zip -DestinationPath glfw-src
          New-Item -ItemType Directory -Force Dependencies/GLFW | Out-Null
          Copy-Item -Recurse glfw-src/glfw-3.4/* Dependencies/GLFW/
          Invoke-WebRequest -Uri "https://github.com/g-truc/glm/archive/refs/tags/1.0.1.tar.gz" -OutFile glm.tar.gz
          tar -xzf glm.tar.gz
          New-Item -ItemType Directory -Force src/vendor/glm | Out-Null
          Copy-Item -Recurse glm-1.0.1/* src/vendor/glm/
          Invoke-WebRequest -Uri "https://github.com/ocornut/imgui/archive/refs/tags/v1.91.8.tar.gz" -OutFile imgui.tar.gz
          tar -xzf imgui.tar.gz
          New-Item -ItemType Directory -Force src/vendor/imgui | Out-Null
          Copy-Item -Recurse imgui-1.91.8/* src/vendor/imgui/
          New-Item -ItemType Directory -Force src/vendor/stb_image | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/2c980bb59875b0d32144a71867fbdebb2f77cd20/stb_image.h" -OutFile src/vendor/stb_image/stb_image.h
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/2c980bb59875b0d32144a71867fbdebb2f77cd20/stb_image_write.h" -OutFile src/vendor/stb_image/stb_image_write.h
          Invoke-WebRequest -Uri "https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0-win32.zip" -OutFile glew-win32.zip
          Expand-Archive glew-win32.zip -DestinationPath glew-dist
          New-Item -ItemType Directory -Force Dependencies/GLEW | Out-Null
          Copy-Item -Recurse glew-dist/glew-2.2.0/include Dependencies/GLEW/include
          Copy-Item -Recurse glew-dist/glew-2.2.0/lib Dependencies/GLEW/lib
      - name: Configure and build (GL, MSVC)
        run: |
          cmake -S . -B build-gl -DASTROVOYAGER_ENABLE_GL=ON
          cmake --build build-gl --config Release
      - name: Smoke CLI and embedded shader table
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build-gl/Release/astro-voyager.exe --version
          ./build-gl/Release/astro-voyager.exe --demo-geodesic
          # Every shader on disk must be present in the generated table.
          $table = Get-Content build-gl/generated/EmbeddedShaders.cpp -Raw
          $missing = @()
          Get-ChildItem shaders/*.vert, shaders/*.frag | ForEach-Object {
            if ($table -notmatch [regex]::Escape("shaders/$($_.Name)")) { $missing += $_.Name }
          }
          if ($missing.Count -gt 0) { throw "embedded shaders missing: $($missing -join ', ')" }
      - name: Portable check from a clean folder (single exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item build-gl/Release/astro-voyager.exe portable/
          Push-Location portable
          ./astro-voyager.exe --version
          ./astro-voyager.exe --demo-geodesic
          Pop-Location
      # v3.8.2: необязательная Authenticode-подпись. Без сертификата шаг
      # тихо скипается (сборка остаётся неподписанной, как раньше). С
      # секретами WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD exe
      # подписывается и штампуется временем — SmartScreen перестаёт показывать
      # «неизвестный издатель», а генерик-эвристики AV теряют повод.
      - name: Sign exe (optional certificate)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CERT_B64) {
            Write-Host 'No signing certificate configured - shipping an unsigned build.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'astro.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          ./packaging/sign-exe.ps1 -Exe build-gl/Release/astro-voyager.exe -PfxPath $pfx -PfxPassword $env:CERT_PASSWORD
      - name: Package (zip + standalone exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item build-gl/Release/astro-voyager.exe dist/stage/
          Copy-Item README.md, LICENSE dist/stage/
          # v3.8.1: AV-нота + контрольные суммы в zip (гигиена ложных
          # срабатываний: неподписанный exe с метаданными и README).
          Copy-Item packaging/win-av-readme.txt dist/stage/
          $hash = (Get-FileHash dist/stage/astro-voyager.exe -Algorithm SHA256).Hash
          "astro-voyager.exe SHA256 = $hash" | Set-Content dist/stage/CHECKSUMS.txt
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/astro-voyager-v$ver-windows-x86_64.zip" -Force
          Copy-Item build-gl/Release/astro-voyager.exe dist/astro-voyager.exe
          Get-FileHash dist/astro-voyager-v*-windows-x86_64.zip, dist/astro-voyager.exe -Algorithm SHA256 | Format-Table -AutoSize
          # Free Inno Setup installer built from the same staged payload as
          # the zip, so portable zip and installer contents never diverge.
          # ISCC is preinstalled on GitHub windows runners.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Host 'ISCC.exe not found - installing Inno Setup via choco.'
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAPP_VERSION=$ver" packaging/installer.iss
          Get-FileHash dist/AstroVoyager-v*-setup.exe -Algorithm SHA256 | Format-Table -AutoSize
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: astro-voyager-windows-x86_64
          path: |
            dist/astro-voyager-v*-windows-x86_64.zip
            dist/astro-voyager.exe
            dist/AstroVoyager-v*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Attach Windows assets to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-Item dist/astro-voyager-v*-windows-x86_64.zip).FullName
          $setup = (Get-Item dist/AstroVoyager-v*-setup.exe).FullName
          gh release upload "${env:GITHUB_REF_NAME}" $zip dist/astro-voyager.exe $setup --clobber
          gh release view "${env:GITHUB_REF_NAME}" --json assets --jq '.assets[].name'

  # Linux AppImage distribution: full OpenGL build (GLFW/ImGui/GLM/stb fetched
  # from upstream releases because Dependencies/ and src/vendor/ are gitignored),
  # AppDir + appimagetool type-2 packaging, headless smoke tests inside the
  # AppImage, then the artifact (and, on tags, a Release asset).
  build-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install GL build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make curl unzip file \
            libgl1-mesa-dev libglew-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev wayland-protocols
      - name: Fetch GL sources (GLFW/GLM/ImGui/stb)
        run: bash packaging/fetch-gl-deps.sh
      - name: Configure and build (GL)
        run: |
          cmake -S . -B build-gl -DCMAKE_BUILD_TYPE=Release -DASTROVOYAGER_ENABLE_GL=ON
          cmake --build build-gl -j"$(nproc)"
      - name: Build AppImage
        run: bash packaging/build-appimage.sh "$PWD/dist"
      - name: Smoke test inside AppImage (headless CLI)
        run: |
          set -euo pipefail
          appimage="$(ls dist/astro-voyager-v*-x86_64.AppImage)"
          echo "AppImage: ${appimage}"
          ./"${appimage}" --appimage-extract >/dev/null
          echo "== AppDir root =="
          ls -la squashfs-root | head -20
          echo "== usr/bin (linuxdeploy may wrap the binary) =="
          ls -l squashfs-root/usr/bin
          file squashfs-root/usr/bin/astro-voyager || true
          echo "== AppRun =="
          cat squashfs-root/AppRun 2>/dev/null || true
          echo "== usr/bin/astro-voyager (head) =="
          head -30 squashfs-root/usr/bin/astro-voyager 2>/dev/null || true
          appdir="$PWD/squashfs-root"
          "${appdir}/AppRun" --version
          "${appdir}/AppRun" --demo-geodesic
          "${appdir}/AppRun" --demo-binet
          # --version must report the version from VERSION
          reported="$(./squashfs-root/AppRun --version | awk '{print $2}')"
          expected="$(tr -d '[:space:]' < VERSION)"
          test "${reported}" = "${expected}"
          # the payload required by the distribution contract is present
          test -x squashfs-root/usr/bin/astro-voyager
          test -f squashfs-root/usr/share/astro-voyager/shaders/bh.frag
          test -f squashfs-root/usr/share/astro-voyager/res/catalog.json
          test -f squashfs-root/usr/share/astro-voyager/README.md
          test -f squashfs-root/usr/share/astro-voyager/LICENSE
          test -f squashfs-root/astro-voyager.desktop
          test -f squashfs-root/usr/share/icons/hicolor/256x256/apps/astro-voyager.png
          # bundled runtime libraries (linuxdeploy) and their GL dependencies
          echo "== bundled .so =="
          find squashfs-root/usr/lib -name '*.so*' -printf '%f\n' | sort
          echo "== ldd of the bundled binary =="
          ldd squashfs-root/usr/bin/astro-voyager | sed 's/^/  /'
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: astro-voyager-appimage-x86_64
          path: dist/astro-voyager-v*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
      - name: Attach AppImage to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          appimage="$(ls dist/astro-voyager-v*-x86_64.AppImage)"
          gh release upload "${GITHUB_REF_NAME}" "${appimage}" --clobber
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
